name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: android-actions/setup-android@v3
        with:
          # The default ("tools platform-tools") fails: the legacy "tools" package is gone.
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"
      - name: Restore release key
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$SIGNING_KEYSTORE_BASE64" ]; then
            mkdir -p signing
            echo "$SIGNING_KEYSTORE_BASE64" | base64 --decode > signing/release.jks
            echo "SIGNING_STORE_FILE=signing/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::SIGNING_KEYSTORE_BASE64 secret missing: the APK will be signed with a throwaway debug key."
          fi
      - run: ./gradlew assembleRelease
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
      - name: Show signing certificate
        run: |
          "$ANDROID_HOME"/build-tools/35.0.0/apksigner verify --print-certs \
            app/build/outputs/apk/release/app-release.apk | grep -E "DN|SHA-256"
      - uses: actions/upload-artifact@v4
        with:
          name: LG-Remote-apk
          path: app/build/outputs/apk/release/app-release.apk
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          cp app/build/outputs/apk/release/app-release.apk "LG-Remote-${GITHUB_REF_NAME}.apk"
          gh release create "$GITHUB_REF_NAME" "LG-Remote-${GITHUB_REF_NAME}.apk" \
            --title "LG Remote ${GITHUB_REF_NAME}" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
